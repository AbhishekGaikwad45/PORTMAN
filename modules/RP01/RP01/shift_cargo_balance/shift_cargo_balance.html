{% extends "base.html" %}

{% block title %}Shift wise cargo Balance (SMS) — RP01{% endblock %}

{% block head %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
    /* ── Breadcrumb ─────────────────────────────────────────────── */
    .breadcrumb {
        font-size: 11px;
        color: var(--text-secondary);
        margin-bottom: 14px;
    }

    .breadcrumb a {
        color: #4a90d9;
        text-decoration: none;
    }

    .breadcrumb a:hover {
        text-decoration: underline;
    }

    /* ── FILTER BAR ─────────────────────────────────────────────── */
    .filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: flex-end;
        margin-bottom: 18px;
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 12px 16px;
        max-width: 660px;
    }

    .filter-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .filter-group label {
        font-size: 10px;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.4px;
    }

    .filter-group input,
    .filter-group select {
        padding: 5px 9px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        font-size: 12px;
        background: var(--bg-primary);
        color: var(--text-primary);
        height: 30px;
    }

    .filter-group input:focus,
    .filter-group select:focus {
        outline: none;
        border-color: #4a90d9;
    }

    .filter-btn {
        padding: 0 18px;
        height: 30px;
        border: none;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        align-self: flex-end;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: background 0.15s ease;
    }

    .filter-btn.primary {
        background: #107c41; /* Excel green accent */
        color: #fff;
    }

    .filter-btn.primary:hover {
        background: #0b6a35;
    }

    .filter-btn.secondary {
        background: #4a90d9;
        color: #fff;
    }

    .filter-btn.secondary:hover {
        background: #357abd;
    }

    .filter-btn:disabled {
        background: #aaa;
        cursor: not-allowed;
    }

    /* ── WHATSAPP / MESSAGE DIRECT BOX ─────────────────────────── */
    .whatsapp-card {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 18px 22px;
        margin-bottom: 24px;
        max-width: 660px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    .whatsapp-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border-color);
    }

    .whatsapp-title-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 700;
        color: var(--text-primary);
    }

    .whatsapp-icon {
        width: 20px;
        height: 20px;
        fill: #25d366;
    }

    .btn-copy-wa {
        background: #25d366;
        color: #ffffff;
        font-size: 12px;
        font-weight: 700;
        padding: 6px 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.15s ease;
        box-shadow: 0 1px 3px rgba(37, 211, 102, 0.25);
    }

    .btn-copy-wa:hover {
        background: #1ebc57;
        transform: translateY(-1px);
    }

    .btn-copy-wa.copied {
        background: #107c41;
    }

    .whatsapp-bubble {
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 18px 20px;
        font-family: 'Consolas', 'Cascadia Code', 'Courier New', monospace;
        font-size: 13.5px;
        line-height: 1.6;
        color: var(--text-primary);
        white-space: pre-wrap;
        word-break: break-word;
        user-select: all;
    }
</style>
{% endblock %}

{% block content %}
<!-- Breadcrumb -->
<div class="breadcrumb">
    <a href="/module/RP01/">Reports</a> &rsaquo; <span>Shift wise cargo Balance (SMS)</span>
</div>

<!-- ══════════════════════════════════════════════════════════════════
     FILTER BAR (ENTRY DATE & SHIFT)
     ══════════════════════════════════════════════════════════════════ -->
<div class="filter-bar">
    <div class="filter-group">
        <label for="entry_date">ENTRY DATE <span style="font-size:9px;color:var(--text-secondary);text-transform:none;font-weight:normal;">(Cutoff: 01-Jun-2026)</span></label>
        <input type="date" id="entry_date" min="2026-06-01" value="{{ default_date }}">
    </div>

    <div class="filter-group">
        <label for="shift">SHIFT</label>
        <select id="shift">
            <option value="A" {% if default_shift == 'A' %}selected{% endif %}>A</option>
            <option value="B" {% if default_shift == 'B' %}selected{% endif %}>B</option>
            <option value="C" {% if default_shift == 'C' %}selected{% endif %}>C</option>
        </select>
    </div>

    <button type="button" class="filter-btn secondary" id="btn-preview" onclick="loadBalanceReport()">
        Preview
    </button>

    <button type="button" class="filter-btn primary" id="btn-download" onclick="downloadExcel()">
        💾 Download Excel
    </button>
</div>

<!-- ══════════════════════════════════════════════════════════════════
     WHATSAPP / SMS DIRECT COPY BLOCK (NO TABLE)
     ══════════════════════════════════════════════════════════════════ -->
<div class="whatsapp-card" id="whatsapp-card-panel">
    <div class="whatsapp-header">
        <div class="whatsapp-title-badge">
            <svg class="whatsapp-icon" viewBox="0 0 24 24">
                <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.312.045-.694.072-2.099-.51-1.795-.745-2.951-2.586-3.04-2.705-.089-.12-1.026-1.365-1.026-2.604 0-1.239.645-1.849.873-2.099.228-.25.497-.312.663-.312.166 0 .332.002.477.01.155.008.363-.058.568.435.213.51.726 1.77.79 1.9.064.13.107.283.021.455-.085.172-.128.28-.255.426-.128.147-.268.328-.383.441-.128.125-.262.261-.112.518.15.257.669 1.103 1.436 1.785.986.877 1.817 1.15 2.074 1.277.257.127.408.106.56-.069.153-.175.654-.761.828-1.023.174-.262.348-.219.584-.131.236.088 1.499.707 1.757.836.257.129.429.193.493.3.064.108.064.624-.08 1.029zM12 2C6.477 2 2 6.477 2 12c0 1.891.524 3.66 1.434 5.173L2 22l4.981-1.306C8.423 21.536 10.154 22 12 22c5.523 0 10-4.477 10-10S17.523 2 12 2z"/>
            </svg>
            <span id="card-header-title">Cargo Balance at Jetty</span>
        </div>
        <button type="button" class="btn-copy-wa" id="btn-copy-wa" onclick="copyWhatsAppText()">
            📋 Copy to WhatsApp
        </button>
    </div>
    <div class="whatsapp-bubble" id="whatsapp-message-box">Loading balance summary...</div>
</div>

<script>
    const CUTOFF_DATE = '2026-06-01';
    let currentSmsText = '';

    function checkCutoffDate(entryDate) {
        if (!entryDate) return true;
        if (entryDate < CUTOFF_DATE) {
            Swal.fire({
                icon: 'info',
                title: 'Report Not Available',
                html: `
                    <b>Cutoff Date:</b> 01-Jun-2026<br><br>
                    Reports before this date are not available.
                `,
                confirmButtonColor: '#4a90d9'
            });
            return false;
        }
        return true;
    }

    function loadBalanceReport() {
        const entryDate = document.getElementById('entry_date').value;
        const shiftVal = document.getElementById('shift').value;

        if (!entryDate) {
            alert('Please select an Entry Date.');
            return;
        }
        if (!shiftVal) {
            alert('Please select a Shift.');
            return;
        }

        if (!checkCutoffDate(entryDate)) {
            currentSmsText = `Cargo Balance at Jetty for ${shiftVal} Shift\n\nCutoff Date: 01-06-2026.\nReports before this date are not available.\n\nTotal: 0 MT.\n\nRegards`;
            document.getElementById('whatsapp-message-box').textContent = currentSmsText;
            return;
        }

        document.getElementById('whatsapp-message-box').textContent = 'Loading balance summary...';

        const url = `/api/module/RP01/shift-cargo-balance/preview?entry_date=${encodeURIComponent(entryDate)}&shift=${encodeURIComponent(shiftVal)}`;

        fetch(url)
            .then(res => res.json())
            .then(data => {
                const shiftTitle = data.title || `Cargo Balance at Jetty for ${shiftVal} Shift`;
                document.getElementById('card-header-title').textContent = shiftTitle;

                currentSmsText = data.sms_text || '';
                document.getElementById('whatsapp-message-box').textContent = currentSmsText || 'No cargo balance recorded for this shift.';
            })
            .catch(err => {
                console.error('Error:', err);
                document.getElementById('whatsapp-message-box').textContent = 'Failed to load balance summary.';
            });
    }

    function copyWhatsAppText() {
        if (!currentSmsText) {
            alert('No message content to copy.');
            return;
        }

        const btn = document.getElementById('btn-copy-wa');
        const showCopiedFeedback = () => {
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '✓ Copied!';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerHTML = originalHtml;
                btn.classList.remove('copied');
            }, 2200);
        };

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(currentSmsText)
                .then(showCopiedFeedback)
                .catch(() => fallbackCopy(showCopiedFeedback));
        } else {
            fallbackCopy(showCopiedFeedback);
        }
    }

    function fallbackCopy(callback) {
        const textArea = document.createElement('textarea');
        textArea.value = currentSmsText;
        textArea.style.position = 'fixed';
        textArea.style.top = '-9999px';
        textArea.style.left = '-9999px';
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            document.execCommand('copy');
            callback();
        } catch (e) {
            alert('Could not copy automatically. Please select the text and copy manually.');
        }
        document.body.removeChild(textArea);
    }

    function downloadExcel() {
        const entryDate = document.getElementById('entry_date').value;
        const shiftVal = document.getElementById('shift').value;

        if (!entryDate || !shiftVal) {
            alert('Please select both Entry Date and Shift.');
            return;
        }

        if (!checkCutoffDate(entryDate)) {
            return;
        }

        window.location.href = `/api/module/RP01/shift-cargo-balance/download?entry_date=${encodeURIComponent(entryDate)}&shift=${encodeURIComponent(shiftVal)}`;
    }

    function getCurrentShift() {
        const now = new Date();
        const hour = now.getHours();
        if (hour >= 6 && hour < 14) return 'A';
        if (hour >= 14 && hour < 22) return 'B';
        return 'C';
    }

    function getOperationalDate() {
        const now = new Date();
        if (now.getHours() < 6) {
            now.setDate(now.getDate() - 1);
        }
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        const dtStr = `${y}-${m}-${d}`;
        return dtStr < CUTOFF_DATE ? CUTOFF_DATE : dtStr;
    }

    function updateShiftOptions() {
        const dateInput = document.getElementById('entry_date');
        const shiftSelect = document.getElementById('shift');
        const opDate = getOperationalDate();
        const curShift = getCurrentShift();
        const shiftRank = { 'A': 1, 'B': 2, 'C': 3 };

        // Ensure minimum date is cutoff date
        dateInput.min = CUTOFF_DATE;

        // Prevent selecting future calendar dates
        dateInput.max = opDate;

        if (dateInput.value && dateInput.value < CUTOFF_DATE) {
            dateInput.value = CUTOFF_DATE;
        }

        const isToday = (dateInput.value === opDate);

        Array.from(shiftSelect.options).forEach(opt => {
            const val = opt.value;
            const isUpcoming = isToday && (shiftRank[val] > shiftRank[curShift]);
            if (isUpcoming) {
                opt.disabled = true;
                opt.text = `${val} (Upcoming)`;
            } else {
                opt.disabled = false;
                opt.text = val;
            }
        });

        // If the selected option is now disabled, fallback to current or latest available shift
        if (shiftSelect.selectedOptions[0] && shiftSelect.selectedOptions[0].disabled) {
            shiftSelect.value = curShift;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const shiftSelect = document.getElementById('shift');
        const dateInput = document.getElementById('entry_date');

        if (!dateInput.value || dateInput.value < CUTOFF_DATE) {
            dateInput.value = getOperationalDate();
        }
        if (!shiftSelect.value) {
            shiftSelect.value = getCurrentShift();
        }

        updateShiftOptions();
        loadBalanceReport();

        dateInput.addEventListener('change', () => {
            updateShiftOptions();
            loadBalanceReport();
        });

        shiftSelect.addEventListener('change', () => {
            loadBalanceReport();
        });
    });
</script>
{% endblock %}
